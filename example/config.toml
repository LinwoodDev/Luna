name="Linwood Pack Registry"
summary="Example Luna registry for app-ready asset packs"
description="""
This repository shows how Luna can publish a static asset registry from TOML files.
Apps can consume the generated `index.json` directly, while users can browse the generated docs site.

## Features

- Versioned asset metadata
- Compatibility hints for consuming apps
- Checksums for downloadable packs
- Static JSON and optional documentation output

## Quick Start

Run `luna build` in this directory, then open `output/docs/index.html` or serve it with `luna preview`.

"""
